
services:
  backend_monitoring:
    build: .
    container_name: backend_monitoring
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8021
    ports:
      - "8021:8021"
    env_file:
      - .dev.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped  # Автоперезапуск при падении

  celery-worker:
    build: .
    command: [ 'celery', '-A', 'src.tools.celery', 'worker', '--pool', 'solo', '-l', 'info' ]
    env_file:
      - .dev.env
    depends_on:
      backend_monitoring:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  celery-beat:
    build: .
    command: [ 'celery', '-A', 'src.tools.celery', 'beat', '-l', 'info' ]
    env_file:
      - .dev.env
    depends_on:
      backend_monitoring:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Web UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: monitoring_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
